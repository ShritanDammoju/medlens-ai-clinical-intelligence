        },
        {
          "@type": "Organization",
          "@id": "https://medlens-ai-clinical-intelligence.vercel.app/#organization",
          "name": "MedLens Technologies",
          "url": "https://medlens-ai-clinical-intelligence.vercel.app/",
          "logo": "https://medlens-ai-clinical-intelligence.vercel.app/favicon.svg",
          "sameAs": [
            "https://github.com/ShritanDammoju/medlens-ai-clinical-intelligence"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://medlens-ai-clinical-intelligence.vercel.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is MedLens and what problem does it solve?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MedLens is an AI-powered clinical information intelligence platform that solves the critical problem of medical record fragmentation. It consolidates laboratory panels, clinical notes, medications, and allergies into a unified, traceable timeline with source-bound reference range verification."
              }
            },
            {
              "@type": "Question",
              "name": "How does MedLens handle laboratory reference intervals?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MedLens strictly bounds biomarker evaluations to the reference intervals printed on the originating source laboratory report. MedLens never hallucinates or synthesizes population reference ranges. If a range is omitted in the source document, it is explicitly flagged as 'Cannot determine'."
              }
            },
            {
              "@type": "Question",
              "name": "How does the patient-doctor connection system work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every clinician receives a unique Doctor Code (e.g. MED-XXXXXX). Patients enter this code in their portal to send an access request. Once approved by the physician on their Doctor Dashboard, the clinician can review reports and perform human verification. Patients maintain full sovereignty and can revoke access at any time."
              }
            },
            {
              "@type": "Question",
              "name": "Does MedLens provide automated medical diagnoses?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. MedLens is non-diagnostic clinical intelligence software designed to synthesize, organize, and trace medical data. All diagnostic and treatment decisions require human clinician verification."
              }
            },
            {
              "@type": "Question",
              "name": "How does data provenance work in MedLens?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every discrete data point (biomarkers, medications, conditions) is stamped with an immutable provenance label: 'Patient Provided', 'Extracted from Report', 'AI Inferred', or 'Verified', including verbatim snippets from the original source file."
              }
            },
            {
              "@type": "Question",
              "name": "What file formats does MedLens support for report ingestion?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MedLens supports PDF clinical files, scanned lab images (PNG, JPG, JPEG), and direct raw text or clinical EHR exports."
              }
            },
            {
              "@type": "Question",
              "name": "How does MedLens ensure patient privacy and security?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "MedLens implements role-based security rules in Cloud Firestore, client-side isolation, and HIPAA-aligned architecture where data is only accessible to the patient and explicitly authorized clinicians."
              }
            },
            {
              "@type": "Question",
              "name": "Can clinicians review and override AI-extracted values?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. MedLens provides a dedicated Verification Center where clinicians can inspect raw text side-by-side with extracted parameters, edit values, verify normal/abnormal statuses, and log reasons to an audit trail."
              }
            }
          ]
        }
      ]
